# Alternativa a Caddy si ya usas Nginx.
# El certificado lo puedes sacar con: certbot certonly --dns-cloudflare

server {
	listen 80;
	listen [::]:80;
	server_name app.ejemplo.com *.dns.ejemplo.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name app.ejemplo.com;

	ssl_certificate     /etc/letsencrypt/live/ejemplo.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/ejemplo.com/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name *.dns.ejemplo.com;

	ssl_certificate     /etc/letsencrypt/live/ejemplo.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/ejemplo.com/privkey.pem;

	# Las consultas DoH son binarias: no aplicar limites de tamano por defecto.
	client_max_body_size 64k;

	location /dns-query {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Content-Type $http_content_type;
		proxy_read_timeout 15s;
	}
}
